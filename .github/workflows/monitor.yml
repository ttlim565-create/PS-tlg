name: price-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟一次
  workflow_dispatch:          # 允许手动点一下运行(测试用)

concurrency:
  group: price-monitor
  cancel-in-progress: false   # 上一轮没跑完就不重叠开新的

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore seen list
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run monitor
        run: python monitor.py
        env:
          CI_MODE: "1"
          PLATFORMS: "amazon,lazada,shopee"
          # 模式一: 普通优惠 (日常好价、高折扣)
          KEYWORDS_DEAL: "water bottle,kettle,earphones,power bank"
          DEAL_MIN_DISCOUNT: "0.55"   # 比市场中位价便宜 55% 以上
          DEAL_ABS_LOW: "2"           # 或真实价 <= 2 也提醒
          DEAL_MIN_MARKET: "15"       # 品类中位价低于 15 就不看
          # 模式二: 价格错误 (贵价货被错标成极低价)
          KEYWORDS_ERROR: "airpods pro,sony headphones,nintendo switch,dyson vacuum,laptop,iphone,ps5,gopro"
          ERROR_MIN_DISCOUNT: "0.70"  # 便宜 70% 以上
          ERROR_ABS_LOW: "0"
          ERROR_MIN_MARKET: "100"     # 只盯中位价 100 以上的品类
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
