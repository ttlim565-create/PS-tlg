name: price-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟一次
  workflow_dispatch:          # 允许手动点一下运行(测试用)

concurrency:
  group: price-monitor
  cancel-in-progress: false   # 上一轮没跑完就不重叠开新的

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore seen list
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            history.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run monitor
        run: python monitor.py
        env:
          CI_MODE: "1"
          PLATFORMS: "amazon,lazada"   # Shopee 在云端会被拦(0结果)，已关闭；有电脑后可加回 shopee
          # 高单价(手机/游戏机含掌机/电器数码)，关键词越具体越准
          KEYWORDS_HIGH: "iphone 17,iphone 16,samsung galaxy s25,samsung galaxy z,xiaomi 15,google pixel,nintendo switch 2,nintendo switch oled,ps5 slim,playstation portal,xbox series x,steam deck,rog ally,legion go,meta quest,samsung tv,lg oled,sony bravia,philips air fryer,dyson v15,dyson airwrap,roborock,dreame,macbook air,ipad,apple watch,airpods pro,sony wh-1000xm5,bose quietcomfort,gopro hero,dji osmo,dji mini"
          # 低价位品牌货
          KEYWORDS_LOW: "anker power bank,anker charger,baseus charger,ugreen charger,xiaomi redmi buds,xiaomi smart band,jbl go,jbl flip,logitech mouse,logitech keyboard,sandisk ssd,kingston ssd,tp-link router,philips shaver,tefal air fryer"
          ERROR_MIN_DISCOUNT: "0.70"  # 价格错误: 比同款中位价便宜 70% 以上
          DEAL_MIN_DISCOUNT: "0.55"   # 普通优惠: 便宜 55% 以上
          HIGH_MIN_MARKET: "100"      # 高单价: 同款中位价低于 100 不看
          LOW_MIN_MARKET: "20"        # 低价位品牌: 同款中位价低于 20 不看
          MAX_RUN_MIN: "25"           # 单次最多跑 25 分钟，关键词随机轮换
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
