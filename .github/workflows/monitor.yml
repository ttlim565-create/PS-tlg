name: price-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟一次
  workflow_dispatch:          # 允许手动点一下运行(测试用)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore seen list
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run monitor
        run: python monitor.py
        env:
          CI_MODE: "1"
          PLATFORMS: "amazon"
          KEYWORDS: "airpods pro,sony headphones,nintendo switch,dyson vacuum,laptop,iphone,samsung galaxy,ps5,gopro,air fryer"
          MIN_MARKET_PRICE: "100"   # 品类中位价低于这个就不看(只盯贵价货)
          MIN_DISCOUNT: "0.70"      # 比市场中位价便宜 70% 以上才提醒
          ABS_LOW_PRICE: "0"        # 不按绝对低价提醒(避免便宜杂物)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
