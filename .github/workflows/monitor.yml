name: price-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟一次
  workflow_dispatch:          # 允许手动点一下运行(测试用)

concurrency:
  group: price-monitor
  cancel-in-progress: false   # 上一轮没跑完就不重叠开新的

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore seen list
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            history.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run monitor
        run: python monitor.py
        env:
          CI_MODE: "1"
          PLATFORMS: "amazon,lazada"   # Shopee 在云端会被拦(0结果)，已关闭；有电脑后可加回 shopee
          # 只盯高单价品牌货，关键词越具体越准(品牌+型号)
          KEYWORDS: "iphone 16,iphone 17,samsung galaxy s25,airpods pro,sony wh-1000xm5,bose quietcomfort,nintendo switch,ps5,xbox series x,steam deck,macbook air,ipad,apple watch,dyson v15,dyson airwrap,gopro hero,dji osmo,dji mini"
          ERROR_MIN_DISCOUNT: "0.70"  # 价格错误: 比同款中位价便宜 70% 以上
          DEAL_MIN_DISCOUNT: "0.55"   # 普通优惠: 便宜 55% 以上
          ERROR_MIN_MARKET: "100"     # 同款中位价低于 100 不看
          DEAL_MIN_MARKET: "100"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
